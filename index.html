<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Alien Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: sticky lab-stage on the left, step panel on the right; bottom bar carries Back/Next. Dark-first, acid green on black. */
:root{
  --bg:#050705; --bg2:#0b100c; --panel:#0e150f; --panel2:#152017; --line:#1f2f23; --line2:#2b3f2f;
  --fg:#e9f4e6; --muted:#8fa693; --accent:#5df23c; --accent2:#b9ff4a; --accent-ink:#06120a; --glow:rgba(93,242,60,.35);
  --warn:#ffb648; --danger:#ff5d6c; --gold:#ffd166;
  --font-display:'Bangers',Impact,'Arial Black',sans-serif; --font-body:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef4ea; --bg2:#e1ebdc; --panel:#ffffff; --panel2:#f1f6ee; --line:#c9d8c6; --line2:#a9bea6;
  --fg:#101a12; --muted:#58705c; --accent:#1e9e3c; --accent2:#16732b; --accent-ink:#ffffff; --glow:rgba(30,158,60,.25);
  --warn:#b86e00; --danger:#c62f42; --gold:#a8741a; color-scheme:light; } }
:root[data-theme="light"]{
  --bg:#eef4ea; --bg2:#e1ebdc; --panel:#ffffff; --panel2:#f1f6ee; --line:#c9d8c6; --line2:#a9bea6;
  --fg:#101a12; --muted:#58705c; --accent:#1e9e3c; --accent2:#16732b; --accent-ink:#ffffff; --glow:rgba(30,158,60,.25);
  --warn:#b86e00; --danger:#c62f42; --gold:#a8741a; color-scheme:light; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;
  background-image:radial-gradient(ellipse at 50% -20%, var(--glow), transparent 55%);}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:400;letter-spacing:.03em;margin:0;text-wrap:balance}
h2{font-size:1.9rem;line-height:1}
h3{font-size:1.25rem;color:var(--accent);line-height:1.1}
.app{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:12px 96px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:6px 14px}
.logo{display:flex;align-items:center;gap:12px}
.logo svg{width:46px;height:46px;flex:none}
.logo h1{font-size:2.3rem;line-height:1;letter-spacing:.04em}
.logo .sub{display:block;font-family:var(--font-body);font-size:.72rem;text-transform:uppercase;letter-spacing:.18em;color:var(--muted);margin-top:2px}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;border:2px solid var(--line);background:var(--panel);font-weight:500;font-size:.85rem}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:.95rem;background:var(--line);color:var(--fg)}
.step.active{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.step.active .n{background:var(--accent);color:var(--accent-ink)}
.step.done .n{background:var(--accent2);color:var(--accent-ink)}

/* layout */
.layout{display:grid;grid-template-columns:minmax(280px,400px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.stage{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);display:grid;gap:10px}
@media (max-width:860px){.stage{position:static}}
.stage-frame{position:relative;border-radius:20px;border:2px solid var(--line);background:var(--panel);overflow:hidden;
  background-image:radial-gradient(circle, var(--line2) 1.1px, transparent 1.5px),radial-gradient(ellipse at 50% 20%, var(--panel2), var(--bg) 75%);
  background-size:9px 9px,100% 100%;background-position:center}
.stage-frame::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 85%, var(--glow), transparent 60%);pointer-events:none}
.stage-frame svg{display:block;width:100%;height:auto;aspect-ratio:420/540;max-height:520px;margin:0 auto;position:relative;z-index:1}
@media (max-width:860px){.stage-frame svg{max-height:300px}}
.stage-tag{position:absolute;top:10px;left:12px;z-index:2;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stage-meta{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.stage-name{font-family:var(--font-display);font-size:1.7rem;line-height:1;letter-spacing:.03em}
.stage-form{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{display:grid;gap:4px;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.stat b{font-family:var(--font-display);font-size:1.2rem;letter-spacing:.04em;color:var(--fg)}
.meter{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px}
.stage-actions{display:flex;gap:8px}
.btn{border:2px solid var(--line2);background:var(--panel2);border-radius:12px;padding:9px 14px;font-weight:500;transition:transform .08s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* panel */
.panel{min-width:0;display:grid;gap:18px}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.panel-head p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.section{display:grid;gap:10px}
.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{font-size:.8rem;color:var(--muted)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.tight{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{position:relative;text-align:left;display:grid;gap:6px;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--panel);transition:border-color .15s,transform .08s}
.card:hover{border-color:var(--line2);transform:translateY(-1px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.card.sel::after{content:"";position:absolute;top:8px;right:8px;width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.card:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card .thumb{aspect-ratio:1/1;border-radius:10px;background:var(--bg2);display:grid;place-items:center;overflow:hidden}
.card .thumb svg{width:100%;height:100%;display:block}
.card .title{font-weight:700;font-size:.92rem}
.card .desc{font-size:.76rem;color:var(--muted);line-height:1.35}
.card .tag{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.card .badge{position:absolute;top:8px;left:8px;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;padding:3px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-weight:500;font-size:.88rem;min-width:46px}
.chip.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:8px}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:10px;font-weight:500;color:var(--muted)}
.tab.sel{background:var(--panel2);color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.attr-row{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.attr-row:first-child{border-top:0}
.attr-row label{font-weight:700;font-size:.88rem}
.attr-row small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
@media (max-width:520px){.attr-row{grid-template-columns:1fr}}
.toggle{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;background:var(--panel)}
.toggle i{width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--fg);transition:left .15s}
.toggle.on{border-color:var(--accent)}.toggle.on i{background:var(--accent)}.toggle.on i::after{left:17px;background:var(--accent-ink)}
.colors{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.color{display:grid;gap:6px;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel)}
.color label{font-size:.78rem;font-weight:700}
.color input[type=color]{width:100%;height:40px;border:2px solid var(--line2);border-radius:8px;background:var(--bg2);padding:2px;cursor:pointer}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{display:grid;grid-template-columns:repeat(4,16px);gap:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;padding:0;background:var(--panel)}
.swatch i{display:block;height:28px}
.swatch:hover{border-color:var(--accent)}
.field{display:grid;gap:6px}
.field label{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.field .row{display:flex;gap:6px}
.field input[type=text],.field textarea{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg2);color:var(--fg);border-radius:10px;padding:9px 12px;font-family:inherit;font-size:1rem}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bio{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px;line-height:1.55;max-width:70ch}
.bio p{margin:0 0 .6em}.bio p:last-child{margin:0}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.summary .kv{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.summary .kv b{display:block;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.counter{font-family:var(--font-display);font-size:1.3rem;color:var(--accent);letter-spacing:.04em}
.power .cat{font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.power .cat i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.power .mods{display:flex;gap:4px;flex-wrap:wrap;font-size:.7rem;font-weight:700}
.power .mods span{background:var(--bg2);border-radius:6px;padding:2px 6px}
.hangar{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.hangar .card .thumb{aspect-ratio:420/540}
.hangar .actions{display:flex;gap:4px}
.archive .card .thumb{aspect-ratio:560/720;background:#0b0f0c}
.archive .card .thumb img{width:100%;height:100%;object-fit:cover;display:block}
.code{display:flex;gap:6px}
.code input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg2);color:var(--fg);border-radius:10px;padding:8px 10px;font-family:ui-monospace,monospace;font-size:.8rem}
.notice{font-size:.82rem;color:var(--accent2);min-height:1.2em}
.empty{color:var(--muted);font-size:.9rem;padding:14px;border:2px dashed var(--line);border-radius:12px}

/* bottom nav */
.navbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:2px solid var(--line)}
.navbar .mid{font-size:.8rem;color:var(--muted);text-align:center;letter-spacing:.1em;text-transform:uppercase}
.navbar .btn{min-width:110px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px}
.modal-box{background:var(--panel);border:2px solid var(--line2);border-radius:18px;padding:16px;max-width:560px;width:100%;max-height:100%;overflow:auto;display:grid;gap:12px}
.modal-box img{width:100%;height:auto;border-radius:12px;display:block}
.modal-box .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" fill="#0b0f0c" stroke="#5df23c" stroke-width="3"/></svg>
      <div><h1>Alien Builder</h1><span class="sub">Omi-Forge specimen lab</span></div>
    </div>
    <nav class="stepper" id="stepper" aria-label="Build steps"></nav>
  </header>

  <main class="layout">
    <aside class="stage" aria-label="Alien preview">
      <div class="stage-frame"><span class="stage-tag">Live specimen</span><div id="preview"></div></div>
      <div class="stage-meta"><div class="stage-name" id="stageName">Unnamed specimen</div><div class="stage-form" id="stageForm"></div></div>
      <div class="stats" id="stageStats"></div>
      <div class="stage-actions">
        <button class="btn" id="btnScramble" type="button">Scramble</button>
        <button class="btn ghost" id="btnReset" type="button">Reset</button>
      </div>
    </aside>
    <section class="panel" id="panel"></section>
  </main>
</div>

<div class="navbar">
  <button class="btn" id="btnBack" type="button">Back</button>
  <div class="mid" id="navLabel"></div>
  <button class="btn primary" id="btnNext" type="button">Next</button>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="row"><h2 id="modalTitle">Specimen card</h2><button class="btn small" id="modalClose" type="button">Close</button></div>
    <img id="modalImg" alt="Rendered alien card">
    <p class="hint" id="modalNote"></p>
    <p class="hint">Right-click or long-press the card to save the image file.</p>
  </div>
</div>

    case 'pupil':return shape(alm,'#f1ede4','stroke-width="4"')+circ(x,y+ry*.1,rx*.6,c.eye,'stroke="none"')+circ(x,y+ry*.1,rx*.3,INK,'stroke="none"')+hl+brow;

function armPts(s,p){const sy=[214,262,298][p];return {s,p,sx:210+s*52,sy,ex:210+s*(100-10*p),ey:sy+46,hx:210+s*(112-8*p),hy:sy+108-14*p}}

function claws(x,y,ux,uy,col,len){let o='';for(const a of [-32,0,32]){const r=a*Math.PI/180,cx=ux*Math.cos(r)-uy*Math.sin(r),cy=ux*Math.sin(r)+uy*Math.cos(r),nx=-cy,ny=cx;o+=shaded(polyD([[x+nx*7,y+ny*7],[x+cx*len,y+cy*len],[x-nx*7,y-ny*7]]),col,'stroke-width="4"',.35)}return o}

<script>

const pick=a=>a[Math.floor(Math.random()*a.length)];

function defaultState(form,keep={}){

}

    <div class="kv"><b>Ratings</b>${Object.keys(STAT_NAMES).map(k=>`${STAT_NAMES[k]} ${st[k]}`).join(' · ')}</div>
  </div>
  <div class="section"><div class="section-title"><h3>Hangar</h3><div class="chips"><button type="button" class="btn small primary" data-act="save">Save to hangar</button><button type="button" class="btn small" data-act="export">Export card</button></div></div>
    <div class="notice" id="notice">${h(notice)}</div>
    ${hangar.length?`<div class="hangar">${hangar.map((e,i)=>`<div class="card"><div class="thumb">${fullSVG(normalize(e.state),'h'+i)}</div><span class="title">${h(e.state.name||'Unnamed')}</span><span class="desc">${FORMS[e.state.form]?FORMS[e.state.form].name:''}</span><div class="actions"><button type="button" class="btn small" data-act="load" data-val="${i}">Load</button><button type="button" class="btn small ghost" data-act="del" data-val="${i}">Delete</button></div></div>`).join('')}</div>`:`<div class="empty">Nothing saved yet. Saved aliens live in this browser only.</div>`}
  </div>
  <div class="section"><div class="section-title"><h3>Card archive</h3><div class="chips"><span class="hint">${cards.length?`${cards.length} card${cards.length===1?'':'s'} · ${archiveSize()} MB in this browser`:'Every exported card is kept here'}</span>${cards.length?'<button type="button" class="btn small ghost" data-act="clearcards">Clear all</button>':''}</div></div>
    ${cards.length?`<div class="hangar archive">${cards.map((e,i)=>`<div class="card"><div class="thumb"><img src="${safeImg(e.png)}" alt="Card for ${h(e.name)}" loading="lazy"></div><span class="title">${h(e.name)}</span><span class="desc">${FORMS[e.form]?FORMS[e.form].name+' · ':''}${new Date(e.ts).toLocaleDateString()}</span><div class="actions"><button type="button" class="btn small" data-act="viewcard" data-val="${i}">View</button><button type="button" class="btn small ghost" data-act="delcard" data-val="${i}">Delete</button></div></div>`).join('')}</div>`:`<div class="empty">No cards yet. Use Export card and each one is saved here automatically.</div>`}
  </div>
  <div class="section"><h3>Share code</h3><p class="hint">Copy this code to send your alien to someone, or paste a code to load one.</p>
    <div class="code"><input type="text" id="shareCode" value="${encode(S)}" readonly aria-label="Share code"><button type="button" class="btn small" data-act="copy">Copy</button></div>
    <div class="code"><input type="text" id="loadCode" placeholder="Paste a share code" aria-label="Paste a share code"><button type="button" class="btn small" data-act="loadcode">Load code</button></div>
  </div>`;
}

/* ---- export card ---- */
function exportCard(){
  const st=computeStats(S),W=560,H=720,name=S.name||'Unnamed specimen';
  const pw=S.powers.map(id=>POWERS.find(p=>p.id===id).name);
  const bars=Object.keys(STAT_NAMES).map((k,i)=>{const y=600+i*22;return `<text x="40" y="${y+11}" font-size="13" fill="#9fb59f" font-family="Helvetica,Arial,sans-serif" font-weight="700">${STAT_NAMES[k].toUpperCase()}</text><rect x="130" y="${y}" width="200" height="12" rx="6" fill="#1f2d22"/><rect x="130" y="${y}" width="${st[k]*20}" height="12" rx="6" fill="#5df23c"/><text x="340" y="${y+11}" font-size="13" fill="#e9f4e6" font-family="Helvetica,Arial,sans-serif" font-weight="700">${st[k]}</text>`}).join('');
  const powersTxt=pw.length?pw.map((p,i)=>`<text x="380" y="${611+i*22}" font-size="13" fill="#e9f4e6" font-family="Helvetica,Arial,sans-serif">• ${h(p)}</text>`).join(''):`<text x="380" y="611" font-size="13" fill="#9fb59f" font-family="Helvetica,Arial,sans-serif">No powers</text>`;
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(18)"><circle cx="6" cy="6" r="1.6" fill="#1c2a1f"/></pattern><radialGradient id="bgglow"><stop offset="0" stop-color="#5df23c" stop-opacity=".28"/><stop offset="1" stop-color="#5df23c" stop-opacity="0"/></radialGradient></defs>
    <rect width="${W}" height="${H}" rx="26" fill="#0b0f0c"/><rect x="18" y="18" width="${W-36}" height="${H-36}" rx="18" fill="url(#grid)" stroke="#2f4636" stroke-width="3"/>
    <ellipse cx="${W/2}" cy="430" rx="230" ry="150" fill="url(#bgglow)"/>
    <g transform="translate(91 92) scale(.9)">${svgWrap(alienSVG(S,{fx:true}),'0 0 420 540','width="420" height="540" x="0" y="0"')}</g>
    <g transform="translate(40 36)"><circle cx="16" cy="16" r="15" fill="#0b0f0c" stroke="#5df23c" stroke-width="3"/>${emblem(16,16,8,'#5df23c')}</g>
    <text x="80" y="58" font-size="30" fill="#e9f4e6" font-family="Impact,'Arial Black',Helvetica,sans-serif" letter-spacing="1">${h(name)}</text>
    <text x="80" y="80" font-size="13" fill="#9fb59f" font-family="Helvetica,Arial,sans-serif" letter-spacing="2">${h((S.species||FORMS[S.form].name).toUpperCase())}${S.planet?' · '+h(S.planet.toUpperCase()):''} · ${SIZES[S.size].name.toUpperCase()}</text>
    <text x="380" y="592" font-size="11" fill="#9fb59f" font-family="Helvetica,Arial,sans-serif" letter-spacing="2">POWERS</text>
    ${bars}${powersTxt}</svg>`;
  const img=new Image();const url='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=W*2;cv.height=H*2;const ctx=cv.getContext('2d');ctx.scale(2,2);ctx.drawImage(img,0,0);
    let note='';
    try{$('modalImg').src=cv.toDataURL('image/png');
      const sm=document.createElement('canvas');sm.width=W;sm.height=H;sm.getContext('2d').drawImage(img,0,0);
      const r=saveCard(sm.toDataURL('image/jpeg',.84),name,S.form);
      note=r.ok?`Saved to your card archive in this browser (${r.count} card${r.count===1?'':'s'}, ${archiveSize()} MB).${r.dropped?` The ${r.dropped} oldest card${r.dropped===1?' was':'s were'} removed to make room.`:''}`:'Shown but not saved: this browser\'s storage is full or unavailable.';
    }catch(e){$('modalImg').src=url;note='Shown but not saved: the image could not be rendered to a file.'}
    $('modalNote').textContent=note;$('modal').hidden=false;$('modalClose').focus();if(step===4)render()};
  img.onerror=()=>{$('modalImg').src=url;$('modalNote').textContent='Shown but not saved: the image could not be rendered.';$('modal').hidden=false};
  img.src=url;
}

/* ---- events ---- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,val=b.dataset.val,key=b.dataset.key;
  switch(act){
    case 'goto':step=+val;break;
    case 'form':setForm(val);return;
    case 'set':{const v=isNaN(val)?val:+val;if(key==='clothing')S.clothing=v;else S[key]=v;break}
    case 'toggle':S[key]=!S[key];break;
    case 'ptab':partsTab=val;break;
    case 'stab':styleTab=val;break;
    case 'part':S.parts[b.dataset.slot]=val;break;
    case 'palette':{const p=PALETTES[+val];S.colors={primary:p.c[0],secondary:p.c[1],accent:p.c[2],eye:p.c[3]};break}
    case 'multi':{const arr=S[key];const i=arr.indexOf(val);i>=0?arr.splice(i,1):arr.push(val);break}
    case 'pcat':powerCat=val;break;
    case 'power':{const i=S.powers.indexOf(val);if(i>=0)S.powers.splice(i,1);else if(S.powers.length<MAX_POWERS)S.powers.push(val);break}
    case 'gen':S[key]=({name:genName,species:genSpecies,planet:genPlanet})[key]();break;
    case 'save':{const hg=lsGet(LS_HANGAR)||[];hg.unshift({ts:Date.now(),state:JSON.parse(JSON.stringify(S))});notice=lsSet(LS_HANGAR,hg.slice(0,12))?`Saved ${S.name||'specimen'} to the hangar.`:'Could not save: browser storage is unavailable.';break}
    case 'load':{const hg=lsGet(LS_HANGAR)||[];if(hg[+val]){S=normalize(JSON.parse(JSON.stringify(hg[+val].state)));notice=`Loaded ${S.name||'specimen'}.`}break}
    case 'del':{const hg=lsGet(LS_HANGAR)||[];hg.splice(+val,1);lsSet(LS_HANGAR,hg);notice='Removed from the hangar.';break}
    case 'copy':{const inp=$('shareCode');const done=()=>{notice='Share code copied.';render()};const fb=()=>{inp.focus();inp.select();notice='Select the code and copy it.';render()};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(inp.value).then(done,fb);else fb();return}
    case 'loadcode':{const st=decode($('loadCode').value);if(st){S=st;notice=`Loaded ${S.name||'specimen'} from code.`}else notice='That code could not be read. Check that you pasted the whole thing.';break}
    case 'export':exportCard();return;
    case 'viewcard':{const cards=lsGet(LS_CARDS)||[];if(cards[+val]&&safeImg(cards[+val].png)){$('modalImg').src=cards[+val].png;$('modalNote').textContent=`${String(cards[+val].name)} · saved ${new Date(cards[+val].ts).toLocaleString()}`;$('modal').hidden=false;$('modalClose').focus()}return}
    case 'delcard':{const cards=lsGet(LS_CARDS)||[];cards.splice(+val,1);lsSet(LS_CARDS,cards);notice='Card removed from the archive.';break}
    case 'clearcards':{lsSet(LS_CARDS,[]);notice='Card archive cleared.';break}
  }
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.color){S.colors[t.dataset.color]=t.value;$('preview').innerHTML=fullSVG(S,'m','role="img" aria-label="Alien preview"',true);lsSet(LS_CUR,S);
    return}
  if(t.dataset.text){S[t.dataset.text]=t.value;$('stageName').textContent=S.name||'Unnamed specimen';$('stageForm').textContent=`${FORMS[S.form].name} · ${SIZES[S.size].name}${S.species?' · '+S.species:''}`;const b=$('bio');if(b)b.innerHTML=bio(S);const sc=$('shareCode');if(sc)sc.value=encode(S);lsSet(LS_CUR,S)}
});
document.addEventListener('change',e=>{if(e.target.dataset.color)render()});
$('btnBack').addEventListener('click',()=>{if(step>0){step--;render();window.scrollTo({top:0})}});
$('btnNext').addEventListener('click',()=>{if(step<STEPS.length-1){step++;render();window.scrollTo({top:0})}else exportCard()});
$('btnScramble').addEventListener('click',scramble);
$('btnReset').addEventListener('click',()=>{S=defaultState(S.form);notice='';render()});
$('modalClose').addEventListener('click',()=>{$('modal').hidden=true});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').hidden=true});

/* ---- boot ---- */
(function(){
  const lg=document.querySelector('.logo svg');if(lg)lg.insertAdjacentHTML('beforeend',emblem(24,24,14,'#5df23c'));
  const saved=lsGet(LS_CUR);
  S=saved&&saved.parts?normalize({...defaultState(saved.form||'humanoid'),...saved,parts:{...defaultState(saved.form||'humanoid').parts,...saved.parts}}):defaultState('humanoid',{name:'Brakkus',species:'Tetramorph',planet:'Khoros Prime'});
  render();
})();
</script>
